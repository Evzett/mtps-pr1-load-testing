# П1 «Плавный»: медленное нарастание (2 мин), плато (2 мин), медленный спад (2 мин).
# arrivalRate — новых виртуальных пользователей в секунду; ~2,7 запроса на пользователя.
# Ожидаемый пик ≈ 5 × 2,7 ≈ 13 RPS.
config:
  phases:
    - name: "Нарастание 1→5 ВП/с"
      duration: 120
      arrivalRate: 1
      rampTo: 5
    - name: "Плато 5 ВП/с"
      duration: 120
      arrivalRate: 5
    - name: "Спад 5→1 ВП/с"
      duration: 120
      arrivalRate: 5
      rampTo: 1
